[project]
name = "tiny-g2p"
version = "0.1.0"
description = "Tiny parallel per-character Polish G2P in the style of gpu-lexer: small model, teacher labels, guarded promotion"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    # Reused, not reimplemented: lexicon fetch/parse, word-level splits (same
    # seed, so the test words are identical to pl_g2p's), PER/word accuracy,
    # and MFA-side normalisation. The experiment is the model and the regime.
    "phoneme-lab",
    "pl-g2p",
]

[project.scripts]
tiny-g2p = "tiny_g2p.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiny_g2p"]

[tool.uv]
package = true

[tool.uv.sources]
phoneme-lab = { path = "../phoneme_lab", editable = true }
pl-g2p = { path = "../pl_g2p", editable = true }

[dependency-groups]
dev = [
    "onnx>=1.22.0",
    "onnxruntime>=1.30.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
