# The workspace root is also the CLI package: `cargo build --release` here
# produces `target/release/tinyg2p`.
#
# Three crates, because one crate cannot be both a `bin` and a `cdylib`
# without the linker losing symbols (the bin links against the cdylib's
# metadata and `cargo test --release` fails with "undefined symbol" -- tried
# `lto`, tried crate-type ordering, it is the mixing itself):
#
#   .        tiny-g2p        the CLI binary
#   core     tiny-g2p-core   the model, no dependencies at all
#   wasm     tiny-g2p-wasm   the browser surface, wasm-bindgen, cdylib
[workspace]
members = ["core", "wasm"]
resolver = "2"

[package]
name = "tiny-g2p"
version = "0.1.0"
edition = "2021"
description = "Tiny per-character Polish G2P: words to IPA on the command line"
license = "MIT"
readme = "CLI.md"
repository = "https://github.com/robertbak/tiny_g2p"
keywords = ["g2p", "phonemizer", "polish", "ipa", "cli"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "tinyg2p"
path = "src/main.rs"

[dependencies]
# The one dependency in the whole project, and only here: the model crate has
# none, and that is the property worth keeping. clap buys --version, generated
# help, `--opt=value` and rejected-argument messages in one place, instead of a
# usage string maintained by hand.
# Default features off: they carry a color/terminal stack (anstream,
# anstyle*, colorchoice, is_terminal_polyfill, utf8parse) that a plain-text
# help output has no use for. What is kept is what the UX needed --
# subcommands, generated help and usage, error context, and the "did you mean"
# suggestions.
clap = { version = "4", default-features = false, features = [
    "std", "derive", "help", "usage", "error-context", "suggestions",
] }

# Path for the workspace, version for the registry: cargo uses the path here and
# requires the version to match, and rewrites it to the version alone when
# packaging. So `tiny-g2p-core` must be published *before* this crate -- a
# versioned dependency on an unpublished crate does not resolve.
tiny-g2p-core = { path = "core", version = "0.1.0" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-mutable-globals"]
