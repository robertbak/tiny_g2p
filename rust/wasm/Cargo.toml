[package]
name = "tiny-g2p-wasm"
version = "0.1.0"
edition = "2021"
description = "The tiny Polish G2P model, compiled to WebAssembly"
license = "MIT"
# Not published to crates.io on purpose: what anyone wants from this crate is
# the .wasm, which `wasm-pack` builds into a package for npm. Publishing it here
# would ship source that still needs wasm-pack and a wasm32 target to be of any
# use. Marked rather than merely unwritten, so `--workspace` publishing cannot
# sweep it up by accident.
publish = false

[lib]
name = "tiny_g2p_wasm"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
tiny-g2p-core = { path = "../core" }
wasm-bindgen = "0.2"
